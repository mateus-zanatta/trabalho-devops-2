<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratório DevOps - Vagrant</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; color: #1f2933; margin: 0; }
    main { max-width: 640px; margin: 80px auto; background: #fff; padding: 32px;
           border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08); }
    h1 { color: #0b5394; margin-top: 0; }
    code { background: #eef2f6; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Laboratório de Fundamentos de DevOps</h1>
    <p>Esta página está sendo servida pelo <strong>Apache</strong> em uma máquina virtual
       <strong>Rocky Linux 9</strong> criada e provisionada automaticamente pelo <strong>Vagrant</strong>.</p>
    <p>Acesso pelo Windows: <code>http://localhost:8080</code> (porta 8080 do host redirecionada
       para a porta 80 da VM).</p>
  </main>

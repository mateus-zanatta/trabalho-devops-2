---
# Variáveis da role configuracao-mariadb.
# Pela precedência do Ansible, "role vars" têm prioridade sobre "vars_files" do playbook,
# por isso os valores aqui devem ser os mesmos de ansible/vars/main.yml.
mysql_root_password: "TROQUE_SENHA_ROOT"
mysql_db_name: "notes"
mysql_user: "notesapp"
mysql_user_password: "TROQUE_SENHA_APP"

---
- name: Configurar servidor de aplicação Java
  hosts: app01
  remote_user: vagrant
  become: yes

  vars_files:
    - ../vars/main.yml

  vars:
    dbhost: "db01"
    dbname: "{{ mysql_db_name }}"
    dbusername: "{{ mysql_user }}"
    dbpassword: "{{ mysql_user_password }}"
    # Diretório do Java 21 instalado pelo dnf (confira o nome exato com: ls /usr/lib/jvm/)
    java21_dir: /usr/lib/jvm/java-21-openjdk-21.0.13.0.9-1.2.el9_8.x86_64

  roles:
    - configuracao-default-so

  tasks:
    - name: Configurar hosts do laboratório
      lineinfile:
        path: /etc/hosts
        line: "{{ item }}"
        state: present
      loop:
        - "192.168.1.2 control-node"
        - "192.168.1.3 app01"
        - "192.168.1.4 db01"

    - name: Criar usuário da aplicação
      user:
        name: app
        comment: Usuario da aplicacao
        create_home: yes
        shell: /bin/bash
        state: present

    - name: Instalar Java 21
      dnf:
        name:
          - java-21-openjdk
          - java-21-openjdk-devel
        state: present

    - name: Configurar Java 21 como padrão
      alternatives:
        name: java
        link: /usr/bin/java
        path: "{{ java21_dir }}/bin/java"
        priority: 2100

    - name: Configurar javac 21 como padrão
      alternatives:
        name: javac
        link: /usr/bin/javac
        path: "{{ java21_dir }}/bin/javac"
        priority: 2100

    - name: Instalar Maven
      dnf:
        name: maven
        state: present

    - name: Criar diretório da aplicação
      file:
        path: /opt/notes
        state: directory
        owner: app
        group: app
        mode: '0755'

    - name: Copiar projeto Easy Notes para app01
      copy:
        src: ../../Easy-Notes-Java/
        dest: /opt/notes/
        owner: app
        group: app
        mode: preserve

    - name: Configurar application.properties
      template:
        src: application.properties
        dest: /opt/notes/src/main/resources/application.properties
        owner: app
        group: app
        mode: '0640'

    - name: Gerar pacote da aplicação
      command: mvn -f /opt/notes/pom.xml clean package
      become_user: app
      environment:
        JAVA_HOME: /usr/lib/jvm/java-21-openjdk
        PATH: "/usr/lib/jvm/java-21-openjdk/bin:/usr/local/bin:/usr/bin:/bin"

    - name: Localizar arquivo JAR da aplicação
      shell: ls /opt/notes/target/easy-notes-*.jar | grep -v original | head -n 1
      register: app_jar
      changed_when: false

    - name: Exibir caminho do JAR
      debug:
        var: app_jar.stdout

    - name: Configurar serviço systemd
      template:
        src: etc/systemd/system/notes.service
        dest: /etc/systemd/system/notes.service
        owner: root
        group: root
        mode: '0644'
      notify:
        - reload daemon
        - restart notes

    - name: Liberar porta 8080 no firewalld
      firewalld:
        port: 8080/tcp
        permanent: yes
        state: enabled
        immediate: yes

    - name: Iniciar e habilitar serviço notes
      service:
        name: notes
        state: started
        enabled: yes

  handlers:
    - name: reload daemon
      systemd:
        daemon_reload: yes

    - name: restart notes
      systemd:
        name: notes
        state: restarted

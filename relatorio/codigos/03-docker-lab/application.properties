## Spring DATASOURCE: o container acessa o MariaDB do db01 (192.168.1.4)
spring.datasource.url=jdbc:mysql://db01:3306/notes?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false
spring.datasource.username=notesapp
# Senha omitida no repositório: informe no arquivo local ou via variável de ambiente
spring.datasource.password=TROQUE_SENHA_APP

## Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

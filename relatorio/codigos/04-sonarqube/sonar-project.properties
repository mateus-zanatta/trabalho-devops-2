# Configuração da análise do projeto Easy Notes (arquivo na raiz do projeto)
sonar.projectKey=easy-notes
sonar.projectName=Easy Notes
sonar.projectVersion=1.0.0

# Código-fonte, testes e classes compiladas (obrigatório para projetos Java)
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.sourceEncoding=UTF-8

sonar.host.url=http://localhost:9000
# O token NÃO fica neste arquivo: ele é lido da variável de ambiente SONAR_TOKEN
